; Production PHP settings for the apps/api image.

; Admin image uploads allow up to 5 MB (StoreProductImageRequest & co.), but
; PHP's default upload_max_filesize is 2 MB, so anything between 2 and 5 MB
; was rejected before Laravel's own validation ever saw it.
upload_max_filesize = 10M
post_max_size = 12M

memory_limit = 256M
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code only changes on deploy, which builds a new image, so never re-check files.
opcache.validate_timestamps = 0
