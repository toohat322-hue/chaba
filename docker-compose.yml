services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chaba
      POSTGRES_USER: chaba
      POSTGRES_PASSWORD: chaba
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaba -d chaba"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chaba_minio
      MINIO_ROOT_PASSWORD: chaba_minio_secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 chaba_minio chaba_minio_secret &&
      mc mb --ignore-existing local/chaba-local &&
      mc anonymous set download local/chaba-local
      "
    restart: "no"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      AWS_ENDPOINT: http://minio:9000
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  api_vendor:
  web_node_modules:
  web_next_cache:
